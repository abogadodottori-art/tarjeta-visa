name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'   # Todos los días a las 12:00 UTC (9:00 AM Argentina)
  workflow_dispatch:        # Permite ejecutarlo a mano si querés probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          PROJECTS='${{ secrets.SUPABASE_PROJECTS_JSON }}'
          echo "$PROJECTS" | jq -c '.[]' | while read -r p; do
            URL=$(echo "$p" | jq -r '.url')
            KEY=$(echo "$p" | jq -r '.anon_key')
            echo "→ Conectando a $URL"
            curl -sS -X POST "$URL/rest/v1/wake_up_supabase" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"value":"ping"}'
          done
